[package]
name = "hu20-trainer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native HU20 external-sampling CFR trainer with exact parity to src/blueprint/solver.py"
publish = false

[dependencies]
hu20-buckets = { path = "../hu20-buckets" }
blake2 = "0.10"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1.10"
# The pinned `pokers` engine deals with rand 0.8.8 `StdRng`; the same crate reproduces its decks.
rand = "=0.8.8"
flate2 = "1"
sha2 = "0.10"
hashbrown = { version = "0.15", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
